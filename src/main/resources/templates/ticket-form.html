
<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Skapa ärende - Helpdesk</title>
</head>
<body>

<h1>Skapa nytt ärende</h1>

<form th:action="@{/tickets}" method="post">

    <div>
        <label for="title">Titel</label>
        <input
                type="text"
                id="title"
                name="title"
                maxlength="255"
                required>
    </div>

    <div>
        <label for="description">Beskrivning</label>
        <textarea
                id="description"
                name="description"
                maxlength="5000"
                required></textarea>
    </div>

    <button type="submit">Skapa ärende</button>

</form>

<p>
    <a th:href="@{/tickets}">Tillbaka till mina ärenden</a>
</p>

</body>
</html>
