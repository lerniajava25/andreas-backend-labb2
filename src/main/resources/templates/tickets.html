
<!DOCTYPE html>
<html lang="sv"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Mina ärenden - Helpdesk</title>
</head>
<body>

<h1>Helpdesk</h1>

<p>
    Välkommen,
    <strong th:text="${username}">Användare</strong>!
</p>


<p sec:authorize="hasAnyRole('AGENT', 'ADMIN')">
    <a th:href="@{/agent/tickets}">
        Supportpanel - Alla ärenden
    </a>
</p>

<p sec:authorize="hasRole('ADMIN')">
    <a th:href="@{/admin/users}">
        Administrationspanel - Hantera användare
    </a>
</p>


<p th:if="${successMessage}"
   th:text="${successMessage}">
</p>

<h2>Mina ärenden</h2>

<p>
    <a th:href="@{/tickets/new}">Skapa nytt ärende</a>
</p>

<p th:if="${#lists.isEmpty(tickets)}">
    Du har inga ärenden ännu.
</p>

<table th:unless="${#lists.isEmpty(tickets)}" border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Titel</th>
        <th>Status</th>
        <th>Skapad</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="ticket : ${tickets}">
        <td th:text="${ticket.id}"></td>
        <td>
            <a th:href="@{/tickets/{id}(id=${ticket.id})}"
               th:text="${ticket.title}">
                Ärendets titel
            </a>
        </td>
        <td th:text="${ticket.status}"></td>
        <td th:text="${ticket.createdAt}"></td>
    </tr>
    </tbody>
</table>

<form th:action="@{/logout}" method="post">
    <button type="submit">Logga ut</button>
</form>

</body>
</html>
