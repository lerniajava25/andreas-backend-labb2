
<!DOCTYPE html>
<html lang="sv"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Alla ärenden - Helpdesk</title>
</head>
<body>

<h1>Supportpanel</h1>

<h2>Alla ärenden</h2>

<p th:if="${#lists.isEmpty(tickets)}">
  Det finns inga ärenden ännu.
</p>

<table th:unless="${#lists.isEmpty(tickets)}" border="1">
  <thead>
  <tr>
    <th>ID</th>
    <th>Titel</th>
    <th>Status</th>
    <th>Skapad</th>
  </tr>
  </thead>

  <tbody>
  <tr th:each="ticket : ${tickets}">
    <td th:text="${ticket.id}"></td>

    <td>
      <a th:href="@{/tickets/{id}(id=${ticket.id})}"
         th:text="${ticket.title}">
        Ärendets titel
      </a>
    </td>

    <td th:text="${ticket.status}"></td>
    <td th:text="${ticket.createdAt}"></td>
  </tr>
  </tbody>
</table>

<p>
  <a th:href="@{/tickets}">Till mina ärenden</a>
</p>

<p sec:authorize="hasAnyRole('AGENT', 'ADMIN')">
  <a th:href="@{/agent/tickets}">
    Öppna supportpanelen
  </a>
</p>

<form th:action="@{/logout}" method="post">
  <button type="submit">Logga ut</button>
</form>

</body>
</html>
